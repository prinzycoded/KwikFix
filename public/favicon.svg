<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100" viewBox="0 0 200 100">
  <defs>
    <linearGradient id="patchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a4a7a"/>
      <stop offset="100%" stop-color="#0d2b4a"/>
    </linearGradient>
    <filter id="emboss">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.5" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="2" specularConstant="0.6" specularExponent="15" result="spec">
        <feDistantLight azimuth="135" elevation="45"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="spec2"/>
      <feComposite in="SourceGraphic" in2="spec2" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Vest background (grey fabric) -->
  <rect width="200" height="100" rx="6" fill="#9e9e9e"/>
  <rect width="200" height="100" rx="6" fill="url(#fabricPattern)" opacity="0.15"/>
  <pattern id="fabricPattern" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="4" fill="none"/>
    <line x1="0" y1="0" x2="4" y2="4" stroke="#000" stroke-width="0.1" opacity="0.1"/>
    <line x1="4" y1="0" x2="0" y2="4" stroke="#000" stroke-width="0.1" opacity="0.1"/>
  </pattern>

  <!-- Stitching lines on vest -->
  <line x1="15" y1="12" x2="185" y2="12" stroke="#b0b0b0" stroke-width="0.5" stroke-dasharray="2,2"/>
  <line x1="15" y1="88" x2="185" y2="88" stroke="#b0b0b0" stroke-width="0.5" stroke-dasharray="2,2"/>

  <!-- Blue patch -->
  <rect x="10" y="20" width="180" height="60" rx="6" fill="url(#patchGrad)" filter="url(#emboss)" stroke="#0a1f3d" stroke-width="1.5"/>
  <rect x="10" y="20" width="180" height="60" rx="6" fill="none" stroke="#3a7abd" stroke-width="0.5" opacity="0.4"/>

  <!-- Stitched border on patch -->
  <rect x="14" y="24" width="172" height="52" rx="4" fill="none" stroke="#5a9adf" stroke-width="0.5" stroke-dasharray="3,2" opacity="0.6"/>

  <!-- Crossed wrenches (left side) -->
  <!-- Wrench 1 (diagonal down-right) -->
  <g transform="translate(42, 50)" filter="url(#shadow)">
    <g transform="rotate(-45)">
      <!-- Handle -->
      <rect x="-2" y="-16" width="4" height="28" rx="2" fill="white"/>
      <!-- Head -->
      <rect x="-6" y="-20" width="12" height="6" rx="1.5" fill="white"/>
      <rect x="-8" y="-18" width="16" height="2" rx="1" fill="white"/>
    </g>
  </g>

  <!-- Wrench 2 (diagonal down-left) -->
  <g transform="translate(55, 50)" filter="url(#shadow)">
    <g transform="rotate(45)">
      <!-- Handle -->
      <rect x="-2" y="-16" width="4" height="28" rx="2" fill="white"/>
      <!-- Head -->
      <rect x="-6" y="-20" width="12" height="6" rx="1.5" fill="white"/>
      <rect x="-8" y="-18" width="16" height="2" rx="1" fill="white"/>
    </g>
  </g>

  <!-- Circle behind wrenches -->
  <circle cx="48" cy="50" r="14" fill="none" stroke="white" stroke-width="1" opacity="0.3"/>

  <!-- KWIKFIX text (right side) -->
  <text x="72" y="58" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="22" fill="white" filter="url(#shadow)" letter-spacing="1">
    KWIKFIX
  </text>
</svg>
