<svg xmlns="http://www.w3.org/2000/svg" width="400" height="120" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#003366"/>
      <stop offset="100%" stop-color="#001a33"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6600"/>
      <stop offset="100%" stop-color="#e05500"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="2" specularConstant="0.4" specularExponent="15" result="spec">
        <feDistantLight azimuth="135" elevation="45"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="spec2"/>
      <feComposite in="SourceGraphic" in2="spec2" operator="arithmetic" k1="0" k2="1" k3="0.3" k4="0"/>
    </filter>
  </defs>

  <!-- Shield/badge shape -->
  <path d="M200 8 L340 40 L340 70 Q340 105 200 115 Q60 105 60 70 L60 40 Z" fill="url(#bgGrad)" filter="url(#shadow)" stroke="#FF6600" stroke-width="2.5"/>

  <!-- Inner border -->
  <path d="M200 16 L330 46 L330 68 Q330 100 200 109 Q70 100 70 68 L70 46 Z" fill="none" stroke="#FF6600" stroke-width="0.8" opacity="0.4" stroke-dasharray="4,3"/>

  <!-- Wrench icon -->
  <g transform="translate(75, 62)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#FF6600" stroke-width="1" opacity="0.3"/>
    <!-- Wrench handle -->
    <rect x="-3" y="-18" width="6" height="30" rx="2.5" fill="white"/>
    <!-- Wrench head -->
    <rect x="-10" y="-22" width="20" height="8" rx="3" fill="white"/>
    <rect x="-12" y="-20" width="24" height="3" rx="1.5" fill="#FF6600"/>
  </g>

  <!-- Kwik text -->
  <text x="125" y="62" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-weight="800" font-size="34" fill="white" filter="url(#shadow)" letter-spacing="1">Kwik</text>

  <!-- Fix text (orange) -->
  <text x="240" y="62" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-weight="800" font-size="34" fill="url(#orangeGrad)" filter="url(#shadow)" letter-spacing="1">Fix</text>

  <!-- Tagline -->
  <text x="200" y="88" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-weight="600" font-size="11" fill="#FF6600" opacity="0.8" letter-spacing="4" text-anchor="middle">YOUR HOME. OUR PROS.</text>
</svg>
